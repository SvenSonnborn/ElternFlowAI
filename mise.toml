# Toolchain pins for Eltern Flow AI — managed by mise (https://mise.jdx.dev).
# mise auto-sets JAVA_HOME + PATH when you cd into this project (mise is
# activated in the shell via `eval "$(mise activate zsh)"`).
#
# java 17 — the Android Gradle build's JDK. The SDK 57 template's Gradle
#           wrapper (9.3.1) runs on JDK 17-25, so the machine default JDK 26
#           failed it ("Unsupported class file major version 70"). SDK 58's
#           template ships Gradle 9.4.1; whether the build now runs on 26 is
#           untested (docs/TODO.md). 17 is both React Native's canonical JDK and
#           Gradle 9's own floor. Bump to 21 if a future SDK's Android build
#           needs it; Renovate is deliberately disabled for this pin (ADR-013).
# node 24 — current LTS; the Expo/Metro-supported track.
# bun — same version as `bun-version:` in the workflows and `constraints.bun` in
#       .github/renovate.json5, so local == CI == the Bun that writes Renovate's
#       lockfile updates. Renovate bumps all of them in one PR ("bun toolchain").
# supabase 2.121.0 — CLI for the local stack in Docker (supabase/config.toml). Before
#           bumping, check that the supabase/cli GitHub release exists — the same
#           lesson as the mise pin in native-build.yml.
#
# .github/workflows/native-build.yml consumes THIS FILE directly (jdx/mise-action)
# rather than re-pinning in YAML — the native builds are where the java pin is
# load-bearing (ADR-016). Editing a pin here therefore changes CI too. `ci.yml`
# still pins Bun via oven-sh/setup-bun.
[tools]
java = "temurin-17"
node = "24"
bun = "1.4.4"
supabase = "2.122.0"

[env]
# Load the gitignored .env.local into the shell. Needed so `.mcp.json` can expand
# ${SUPABASE_ACCESS_TOKEN} for the Supabase MCP server (see .env.example). mise
# silently skips the file when it doesn't exist, so a fresh clone still works.
_.file = ".env.local"
