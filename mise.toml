# Toolchain pins for Eltern Flow AI — managed by mise (https://mise.jdx.dev).
# mise auto-sets JAVA_HOME + PATH when you cd into this project (mise is
# activated in the shell via `eval "$(mise activate zsh)"`).
#
# java 17 — required by the Android Gradle build: the project's Gradle wrapper
#           (9.3.1, from the SDK 57 template) runs on JDK 17-25 — JDK 26 needs
#           Gradle 9.4+ — but the machine default is JDK 26 ("Unsupported class
#           file major version 70"). 17 is both React Native's canonical JDK and
#           Gradle 9's own floor. Bump to 21 if a future SDK's Android build
#           needs it; Renovate is deliberately disabled for this pin (ADR-013).
# node 24 — current LTS; the Expo/Metro-supported track.
# bun 1.3.14 — matches the pinned Bun in CI (.github/workflows/ci.yml) so local == CI.
#
# .github/workflows/native-build.yml consumes THIS FILE directly (jdx/mise-action)
# rather than re-pinning in YAML — the native builds are where the java pin and
# the RCT_USE_PREBUILT_RNCORE value below are load-bearing (ADR-016). Editing a
# pin here therefore changes CI too. `ci.yml` still pins Bun via oven-sh/setup-bun.
[tools]
java = "temurin-17"
node = "24"
bun = "1.3.14"

[env]
# Load the gitignored .env.local into the shell. Needed so `.mcp.json` can expand
# ${SUPABASE_ACCESS_TOKEN} for the Supabase MCP server (see .env.example). mise
# silently skips the file when it doesn't exist, so a fresh clone still works.
_.file = ".env.local"

# Expo SDK 55 enables "prebuilt React Native core" (the React-Core-prebuilt pod /
# React.xcframework) for iOS by default. On this project, CocoaPods resolved a
# STALE, mismatched prebuilt binary — React-Core-prebuilt 0.81.5 against
# React-Core 0.83.6 source — whose headers predate RCTDevMenuConfiguration, so the
# iOS build fails with "expected a type" in Expo's EXReactRootViewFactory.h.
# Forcing RN to build from source (the SDK-54 behaviour) sidesteps the prebuilt
# binary entirely. The generated ios/Podfile (line 19) reads it as
# `ENV['RCT_USE_PREBUILT_RNCORE'] ||= podfile_properties['ios.buildReactNativeFromSource'] == 'true' ? '0' : '1'`
# — and this project sets no such key, so without this variable the value falls
# back to '1'. That makes this line the ONLY thing holding the pin, which is why
# native-build.yml asserts it explicitly instead of trusting it through.
# Trade-off: slower iOS builds. Revisit once a later SDK's prebuilt RN is stable.
RCT_USE_PREBUILT_RNCORE = "0"
