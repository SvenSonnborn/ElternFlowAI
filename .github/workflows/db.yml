name: DB

# Bewusst OHNE `paths`-Filter: Dieser Job ist ein Required Check (Ruleset
# „main protection"). Ein Required Check mit Pfadfilter läuft auf PRs, die
# nichts an der Datenbank ändern, gar nicht erst — GitHub wertet ihn dann als
# „ausstehend" und blockiert genau diese PRs für immer. Unbedingt laufen lassen
# kostet wenige Minuten.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db:
    name: Database (migrations · pgTAP · integration)
    runs-on: ubuntu-latest
    # Image-Pulls des Supabase-Stacks (~10 Container) und `supabase start`
    # dominieren mit grob 3-6 Minuten, pgTAP und Integrationstests laufen danach
    # in unter zwei. 20 Minuten lassen reichlich Luft, ohne einen hängenden
    # Container-Start eine Stunde lang Runner blockieren zu lassen.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Kein Git-Schritt folgt dem Checkout, der GITHUB_TOKEN wird also nie
          # gebraucht — ihn trotzdem in .git/config zu hinterlassen, exponiert ihn
          # nur gegenüber dem Fremdcode, den dieser Workflow ausführt:
          # bun-Postinstall-Skripte und die Testläufe selbst.
          persist-credentials: false

      # Toolchain aus mise.toml (supabase CLI · bun · node), nicht aus YAML:
      # die CLI-Version bestimmt, wie Migrationen angewendet und Tests
      # ausgeführt werden, und soll lokal und in CI dieselbe sein. mise.toml
      # lädt zwar `.env.local` per `[env] _.file`, mise überspringt die Datei
      # aber still, wenn sie fehlt — in CI gibt es sie nicht.
      - name: Setup toolchain (mise)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          # mise selbst gepinnt, siehe native-build.yml: ohne `version` fragt die
          # Action nach „latest", und ein gemeldetes Release kann noch gar nicht
          # existieren (2026-09-08, 404 nach 15 Sekunden).
          version: 2026.11.5

      # Versionsdrift der CLI sieht sonst wie ein Projektfehler aus (andere
      # Migrationsreihenfolge, andere Lint-Ausgabe). Hart prüfen statt vermuten,
      # im Stil der Pin-Checks in native-build.yml. Den Soll-Wert liest
      # `mise current` aus mise.toml: Eine Kopie der Zahl hier hob Renovate
      # nicht mit, und jeder Bump der CLI scheiterte an diesem Schritt.
      - name: Assert supabase CLI pin from mise.toml
        run: |
          set -e
          expected="$(mise current supabase)"
          version="$(supabase --version)"
          echo "supabase --version: ${version} (mise.toml: ${expected})"
          if [ "${version}" != "${expected}" ]; then
            echo "::error::Expected supabase CLI ${expected} (mise.toml pin), got '${version}'."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Genau die Dienste, die supabase/config.toml einschaltet — keine
      # `-x`-Ausschlüsse. Der Broadcast-Beweis braucht den Realtime-Container,
      # und der pgTAP-Race-Test spricht per dblink TCP mit den lokalen
      # Standard-Zugangsdaten (postgres/postgres). Wendet alle Migrationen und
      # seed.sql an; scheitert eine Migration, scheitert der Job hier.
      - name: Start local Supabase
        run: supabase start

      # `--fail-on warning` ist nötig: ohne ihn meldet `db lint` Befunde nur und
      # beendet sich immer mit 0, der Schritt könnte nie rot werden.
      - name: Lint schema
        run: supabase db lint --level warning --fail-on warning

      # `supabase test db` (pgTAP) und danach die Integrationstests gegen den
      # laufenden Stack; URL und Schlüssel kommen aus `supabase status -o env`,
      # es braucht keine Secrets.
      - name: Test database
        run: bun run test:db

      # Nur bei Rot: Ein Container, der nicht gesund wird, oder ein Realtime-/
      # dblink-Timing-Fehler hinterlässt sonst nur die CLI-Ausgabe, und der
      # Runner ist danach weg. `|| true`, damit die Diagnose selbst nie den
      # eigentlichen Fehler überdeckt. Aufräumen braucht es nicht: Der Runner
      # ist ephemer.
      - name: Diagnose on failure
        if: failure()
        run: |
          supabase status || true
          docker ps -a || true
          for c in $(docker ps -a --format '{{.Names}}' | grep '^supabase_'); do
            echo "::group::docker logs ${c}"
            docker logs --tail 200 "${c}" 2>&1 || true
            echo "::endgroup::"
          done
