name: Expo SDK Sync

# Renovates Expo-Major-PR hebt nur das Paket `expo` selbst — für sich genommen
# ein kaputter Zustand, weil react-native und alle expo-* noch auf dem alten SDK
# stehen. Dieser Workflow lässt `expo install --fix` die SDK-verwalteten Pakete
# nachziehen und schiebt das Ergebnis in denselben PR-Branch.
#
# Warum nicht Renovates eigenes `postUpgradeTasks`: das wird von
# `allowedCommands` gegated, einer self-hosted-only Admin-Option. Auf der
# gehosteten Mend-App nicht verfügbar. Siehe ADR-013.
on:
  pull_request:
    # Bewusst OHNE `reopened`: die dokumentierte Abhilfe gegen den fehlenden
    # CI-Retrigger (siehe Kommentar am "PR kommentieren"-Schritt unten) ist,
    # den PR einmal zu schließen und wieder zu öffnen. Der Sync soll dabei
    # nicht erneut auf seinem eigenen, bereits gepushten Commit feuern.
    types: [opened, labeled, synchronize]

permissions:
  contents: write
  pull-requests: write

# Renovate setzt seine Labels nach dem Anlegen des PR über die Issues-API, was
# pro Label ein eigenes `labeled`-Event auslöst — plus `opened`. Es landen also
# bis zu vier Runs in derselben Concurrency-Gruppe. `cancel-in-progress: false`,
# weil ein abgebrochener Run, der schon gepusht, aber den Schritt "PR
# kommentieren" noch nicht erreicht hat, diesen Hinweis auf Schließen/
# Wiederöffnen sonst verschluckt — und `main` hat aktuell keine Required Status
# Checks, der Kommentar ist also die gesamte Absicherung. Serialisierung kostet
# dafür nur ein paar Runner-Minuten: die Runs sind idempotent, ein zweiter
# findet keinen Diff mehr und ist ein No-op.
concurrency:
  group: expo-sdk-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    name: expo install --fix nach SDK-Bump
    # Nur Renovates eigener SDK-PR, nur aus diesem Repo (kein Fork — ein Fork-PR
    # mit `contents: write` wäre eine Rechteausweitung).
    #
    # `pull_request.user.login` statt `github.actor`: beim `labeled`-Event ist
    # der Actor derjenige, der das Label gesetzt hat, nicht der PR-Autor.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'expo-sdk')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      # Bewusst ohne --frozen-lockfile: Renovate hat package.json bewegt,
      # bun.lock ist gegenüber der neuen expo-Version veraltet.
      - name: Install
        run: bun install

      - name: expo install --fix
        run: bunx expo install --fix

      - name: Lockfile nachziehen
        run: bun install

      # Nur Bericht, kein Gate: expo-doctor meldet auch Dinge, die einen
      # SDK-Sprung nicht blockieren. Ohne Pipe/Umleitung, damit der
      # Schritt-Exit-Status der von expo-doctor bleibt (bash -e ohne
      # pipefail würde ihn hinter einem `tee` sonst immer auf 0 setzen) —
      # die Ausgabe landet ohnehin im Job-Log.
      - name: expo-doctor
        id: doctor
        continue-on-error: true
        run: bunx expo-doctor

      # commit/push laufen bewusst durch die Repo-Hooks (simple-git-hooks
      # aus dem `bun install` oben installiert sie auch auf dem Runner):
      # pre-commit lässt Prettier über die von expo install --fix
      # geschriebene package.json laufen, sonst könnte format:check auf
      # genau diesem PR rot werden. pre-push ist aktuell per exit 0
      # deaktiviert (scripts/coderabbit-prepush.sh) — eine künftige
      # Reaktivierung muss CI ausnehmen, sonst liefe coderabbit review hier
      # unauthentifiziert und dieser Push schlüge fehl.
      - name: Commit & push
        id: sync
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- package.json bun.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine Abweichung — die SDK-Pakete sind bereits konsistent." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "chore(deps): expo install --fix nach SDK-Bump"
          git push origin HEAD:"$HEAD_REF"

      - name: PR kommentieren
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCTOR_OUTCOME: ${{ steps.doctor.outcome }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "**Expo SDK Sync** hat die SDK-verwalteten Pakete nachgezogen:"
            echo
            echo '```'
            git show --stat --format= HEAD
            echo '```'
            echo
            echo "\`expo-doctor\`: **$DOCTOR_OUTCOME** (nur Bericht, kein Gate — Details im Job-Log)."
            echo
            echo "> Der Push lief mit \`GITHUB_TOKEN\` und triggert daher **keinen** neuen CI-Lauf."
            echo "> PR einmal schließen und wieder öffnen, damit die Gates über den vollständigen Diff laufen."
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
