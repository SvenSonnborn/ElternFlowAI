name: Native Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Nur PRs brechen einander ab. Der Event-Name in der Gruppe hält einen Push auf
# `main` aus der Gruppe des Wochenbuilds heraus, sodass er ihn nicht abbricht.
concurrency:
  group: native-build-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Caches: Nur `main` schreibt (die `actions/cache/save`-Steps am Jobende), PRs
# lesen nur. Ein PR-Cache ist für andere PRs unsichtbar und verdrängte bei
# 10 GB Repo-Limit die nützlichen von `main`. Einzige Ausnahme ist die winzige
# Marke „nativer Stand gebaut und gestartet" der Compile-Jobs, die jedes
# Ereignis schreibt (siehe `native-key` im Android-Job).

# Dieselben Supabase-Platzhalter wie in ci.yml. Metro setzt EXPO_PUBLIC_* beim
# Bundeln ein; ohne sie stünde `undefined` im Bundle, wo die App einen String
# erwartet. Gebündelt wird in allen drei Jobs: im `bundle`-Job per `expo
# export`, in den Compile-Jobs durch Gradle und Xcode beim Release-Build. Dort
# hängt der Startcheck daran: features/supabase/client.ts wirft ohne URL schon
# beim Start, der Check würde rot, obwohl die App stimmt. Einen Server
# braucht er nicht, die Platzhalter zeigen auf keinen.
env:
  EXPO_PUBLIC_SUPABASE_URL: https://test.supabase.invalid
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test

# Three independent jobs, deliberately WITHOUT `needs:` between them. Runner
# minutes are free on a public repo, so the only currency is wall-clock: running
# them in parallel makes the PR wait max(bundle, android, ios) instead of the
# sum. The longer of the two native jobs sets the wait.
#
# Toolchain comes from mise.toml via mise-action (java · node · bun) —
# NOT from setup-bun as in ci.yml. The native builds are exactly where the pins
# in mise.toml are load-bearing (see ADR-016), so they read the same file the
# developer's shell does rather than a second copy in YAML.
jobs:
  bundle:
    name: Metro bundle (ios · android)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Kein Git-Schritt folgt dem Checkout, der GITHUB_TOKEN wird also nie
          # gebraucht — ihn trotzdem in .git/config zu hinterlassen, exponiert ihn
          # nur gegenüber dem vielen Fremdcode, den dieser Workflow ausführt:
          # bun-Postinstall-Skripte, expo-Config-Plugins, CocoaPods- und
          # Gradle-Plugins. `permissions: contents: read` begrenzt den Schaden,
          # beseitigt ihn aber nicht. (Gilt nicht für expo-sdk-sync.yml — der
          # pusht und braucht die Credentials.)
          persist-credentials: false

      - name: Setup toolchain (mise)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          # mise selbst gepinnt, nicht nur die Tools darin. Ohne `version`
          # fragt die Action nach „latest" — und mise' Versions-Endpunkt kann
          # eine Version melden, deren GitHub-Release noch gar nicht
          # veröffentlicht ist. Genau das ist am 2026-09-08 passiert: Der
          # Endpunkt nannte 2026.9.3, das Release existierte nicht, und alle
          # drei Jobs starben nach 15 Sekunden an einem 404 beim Download —
          # vor der ersten Zeile Projektcode. Ein Pin macht diesen Workflow
          # gegen fremde Release-Rennen immun und passt zu mise.toml, das
          # node, bun und java ohnehin exakt festschreibt. Beim Anheben
          # prüfen, dass das Release wirklich existiert:
          # https://github.com/jdx/mise/releases
          version: 2026.11.5
          # Schreibt den mise-Cache nur auf main (siehe Cache-Kommentar oben).
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache Bun dependencies
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      # Das native JS-Bundle prüft auf jedem PR nur dieser Job. Der Web-Export
      # in ci.yml löst `DateTimePickerSheet.web.tsx` auf, das native
      # Gegenstück `DateTimePickerSheet.tsx` (abgetrennt in ADR-010) kompiliert
      # er nie. Die Release-Builds der Compile-Jobs bundeln zwar ebenfalls, aber
      # nur, wenn sie bauen: Steht eine Marke für den nativen Stand, entfällt
      # der Compile, auch bei geändertem JS. Zwei Aufrufe, weil `expo export
      # -p` genau eine Plattform nimmt und `all` den Web-Export aus ci.yml
      # wiederholte.
      - name: Metro bundle (iOS)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bunx expo export --platform ios --output-dir dist-ios

      - name: Metro bundle (Android)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bunx expo export --platform android --output-dir dist-android

      # Was ein grüner Build nicht zeigt, sieht nur expo-doctor: Paketversionen
      # abseits der SDK-Vorgabe, doppelte Deps, ungültige app.json-Felder.
      # Kein Gate, weil er Expos API und das React Native Directory abfragt und
      # weil jede Lockfile-Wartung, die `expo` anhebt, die Vorgabe verschiebt.
      # Ein Befund wird stattdessen zur Warnung im Checks-Tab des PRs, damit ihn
      # niemand erst im Log suchen muss. `timeout` beendet einen hängenden Abruf,
      # bevor der Required Check ins Joblimit läuft, und führt in dieselbe
      # Warnung.
      - name: expo-doctor
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: timeout 5m bunx expo-doctor || echo "::warning title=expo-doctor::expo-doctor meldet Befunde oder lief ins Zeitlimit, Details im Log des Steps expo-doctor im Job Metro bundle."

      # Kein `always()`: Das implizite `success()` verhindert, dass ein roter
      # Lauf einen Cache schreibt. `path` muss dem Restore-Step entsprechen,
      # sonst ist der gespeicherte Eintrag für ihn unsichtbar; ci.yml liest
      # denselben Eintrag.
      - name: Save Bun cache (main only)
        if: github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}

  android:
    name: Android (prebuild · assembleRelease · Startcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Kein Git-Schritt folgt dem Checkout, der GITHUB_TOKEN wird also nie
          # gebraucht — ihn trotzdem in .git/config zu hinterlassen, exponiert ihn
          # nur gegenüber dem vielen Fremdcode, den dieser Workflow ausführt:
          # bun-Postinstall-Skripte, expo-Config-Plugins, CocoaPods- und
          # Gradle-Plugins. `permissions: contents: read` begrenzt den Schaden,
          # beseitigt ihn aber nicht. (Gilt nicht für expo-sdk-sync.yml — der
          # pusht und braucht die Credentials.)
          persist-credentials: false

      - name: Setup toolchain (mise)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          # mise selbst gepinnt, nicht nur die Tools darin. Ohne `version`
          # fragt die Action nach „latest" — und mise' Versions-Endpunkt kann
          # eine Version melden, deren GitHub-Release noch gar nicht
          # veröffentlicht ist. Genau das ist am 2026-09-08 passiert: Der
          # Endpunkt nannte 2026.9.3, das Release existierte nicht, und alle
          # drei Jobs starben nach 15 Sekunden an einem 404 beim Download —
          # vor der ersten Zeile Projektcode. Ein Pin macht diesen Workflow
          # gegen fremde Release-Rennen immun und passt zu mise.toml, das
          # node, bun und java ohnehin exakt festschreibt. Beim Anheben
          # prüfen, dass das Release wirklich existiert:
          # https://github.com/jdx/mise/releases
          version: 2026.11.5
          # Schreibt den mise-Cache nur auf main (siehe Cache-Kommentar oben).
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      # A wrong JDK fails Gradle with "Unsupported class file major version",
      # which reads like a project bug rather than a toolchain mismatch. The
      # ubuntu runner ships its own JDK and its own JAVA_HOME, so assert that
      # mise's pin actually won before spending 15 minutes finding out.
      - name: Assert JDK pin from mise.toml
        run: |
          set -e
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          java -version
          major="$(java -version 2>&1 | sed -n '1s/.*version "\([0-9]*\).*/\1/p')"
          if [ "$major" != "17" ]; then
            echo "::error::Expected JDK 17 (mise.toml pin), got major version '${major:-<unknown>}'."
            exit 1
          fi

      - name: Cache Bun dependencies
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      # Schlüssel des nativen Stands; was er enthält, steht im Kopf von
      # scripts/native-build-key.sh. Berechnet vor dem Prebuild, weil der
      # Fingerprint ein vorhandenes `android/` mithashen würde. Zuweisung
      # statt `echo "key=$(…)"`, damit `bash -e` abbricht, wenn das Skript
      # scheitert: Ein leerer Schlüssel darf nie entstehen.
      - name: Native build key
        id: native-key
        run: |
          key="$(bash scripts/native-build-key.sh android)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # Die Marke ist ein Cache-Eintrag unter diesem Schlüssel; `lookup-only`
      # prüft nur, ob es ihn gibt. Ein PR sieht seine eigenen Marken und die
      # aus `main`, ein Push auf `main` nur die aus `main`.
      - name: Look up native build marker
        id: marker
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .native-build-marker
          key: ${{ steps.native-key.outputs.key }}
          lookup-only: true

      # `schedule` und `workflow_dispatch` bauen immer: Der Wochenbuild fängt
      # Drift, die nicht im Schlüssel steht, der manuelle Lauf prüft den
      # Vollbuild-Pfad. Übersprungen wird per `if` an jedem folgenden Step,
      # nicht am Job: Eine Job-Bedingung bräuchte `needs:` auf einen eigenen
      # Schlüssel-Job. So endet der Job unter seinem Namen grün, wie es der
      # Required Check erwartet.
      - name: Decide whether to build
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          MARKER_HIT: ${{ steps.marker.outputs.cache-hit }}
          NATIVE_KEY: ${{ steps.native-key.outputs.key }}
        run: |
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ] || [ "$MARKER_HIT" != true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android: Derselbe native Stand wurde bereits gebaut und gestartet (Schlüssel $NATIVE_KEY). Prebuild, Compile und Startcheck entfallen, ein Startabsturz durch JS-Änderungen bleibt in diesem Lauf ungeprüft."
          fi

      # `android/` is gitignored (CNG), so it never exists in a fresh checkout.
      # `--clean` states the invariant anyway: CI always compiles a freshly
      # generated native project, never a stale one. `--no-install` skips the
      # package-manager run that `bun install` above already did.
      - name: Prebuild (android)
        if: steps.decide.outputs.build == 'true'
        run: bunx expo prebuild --platform android --no-install --clean

      # Restored AFTER prebuild: `--clean` wipes the native directory, so a
      # cache seeded before it would be thrown away.
      - name: Cache Gradle
        id: gradle-cache
        if: steps.decide.outputs.build == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('bun.lock', 'app.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Release statt Debug: Nur Release bundelt das JS ins APK, und der
      # Startcheck unten läuft ohne Metro. Signiert wird mit dem
      # Debug-Keystore der Prebuild-Vorlage, also ohne Secret.
      #
      # `--build-cache` weil `prebuild --clean` jeden Lauf sämtlichen
      # inkrementellen Build-Zustand in `android/` löscht — ohne ihn cached der
      # Gradle-Cache oben NUR heruntergeladene Dependencies, also nicht den
      # teuren Teil. Der lokale Build-Cache liegt unter
      # ~/.gradle/caches/build-cache-1 und ist damit vom bestehenden
      # Cache-Step bereits abgedeckt. Erwartungsmanagement: das beschleunigt
      # Kotlin-/Java-Compile und Resource-Tasks, NICHT die CMake/NDK-Schritte —
      # `externalNativeBuild`-Tasks sind nicht cachebar.
      - name: Gradle assembleRelease
        if: steps.decide.outputs.build == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace --build-cache

      # Kein `always()`, `path` wie im Restore-Step: Begründung im `bundle`-Job.
      # Bun wird hier nur geladen; den Schlüssel schreibt der `bundle`-Job.
      - name: Save Gradle cache (main only)
        if: steps.decide.outputs.build == 'true' && github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      # Startcheck: Die gebaute App muss im Emulator bis zum Login kommen
      # (scripts/startcheck.sh). Er steht hinter dem Cache-Save, weil der Cache
      # nur am Compile hängt, und vor der Marke, damit nur eine gestartete App
      # eine Marke hinterlässt.
      #
      # Prüfumgebung und App werden getrennt gewertet (Kopf von
      # scripts/startcheck.sh). Deshalb laufen die Steps bis zum Urteil mit
      # `continue-on-error`: Ein Fehlschlag färbt den Job nicht selbst, über
      # Grün oder Rot entscheidet allein `verdict` anhand von
      # startcheck-artifacts/result. Die Zeitlimits je Step sollen einen
      # hängenden Schritt im Urteil landen lassen statt im Joblimit, das den
      # Job ohne Urteil und ohne Upload rot abbräche. Das hält nur, solange das
      # Joblimit über Setup und Compile (bislang unter 25 Minuten) plus der
      # Summe aller Startcheck-Limits liegt, hier 10 + 20 + 20 Minuten. Wer ein
      # Step-Limit anhebt, hebt das Joblimit mit an.
      #
      # Der Emulator braucht KVM. /dev/kvm gibt es auf dem Runner, aber nur für
      # root und die Gruppe kvm; die Regel öffnet es für den Runner-Nutzer.
      # Gehört zur Prüfumgebung: Ohne KVM ist der Emulator sinnlos, ein
      # Fehlschlag endet ohne Ergebnisdatei, also als Warnung ohne Marke.
      - name: Enable KVM
        id: kvm
        if: steps.decide.outputs.build == 'true'
        continue-on-error: true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        id: maestro
        if: steps.decide.outputs.build == 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: bash scripts/startcheck.sh install-maestro

      # x86_64, weil der Runner x86_64 ist und das APK alle vier ABIs enthält.
      # `script` bleibt einzeilig: Die Action führt jede Zeile in einer eigenen
      # Shell aus, mehrzeilige Shell-Logik zerfiele dort.
      #
      # 4 GB statt der 2,5 GB, die der Emulator sonst nimmt: Solange das Image
      # nach dem Boot seine Dienste startet, wird der Speicher knapp, und in
      # genau so einem Moment riss einmal die adb-Verbindung ab. Deshalb mehr
      # Speicher; der Runner hat 16 GB.
      - name: Startcheck (Android emulator)
        id: startcheck
        if: steps.decide.outputs.build == 'true' && steps.kvm.outcome == 'success' && steps.maestro.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/startcheck.sh run android android/app/build/outputs/apk/release/app-release.apk

      # Zweiter Boot des Emulators. Die Action bootet und prüft in einem Step,
      # also steckt die Wiederholung des Boots hier statt im Skript. Ob der
      # erste Step am Boot scheiterte, zeigt die fehlende Ergebnisdatei: `run`
      # legt sie als Erstes an, auf einem gebooteten Emulator gibt es sie also
      # immer. Scheiterte dagegen die App, gibt es keinen zweiten Boot; ihre
      # Wiederholung hat `run` schon selbst erledigt. `with` muss dem ersten
      # Step gleichen, sonst prüfte der zweite Anlauf ein anderes Gerät.
      - name: Startcheck (Android emulator, zweiter Boot)
        id: startcheck-reboot
        if: steps.decide.outputs.build == 'true' && steps.startcheck.outcome == 'failure' && hashFiles('startcheck-artifacts/result') == ''
        continue-on-error: true
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/startcheck.sh run android android/app/build/outputs/apk/release/app-release.apk

      # Grün nur mit `result` = ok. Fehlt die Datei, kam die App nie an die
      # Reihe: Warnung im Checks-Tab, Job grün, aber ohne `ok=true` und damit
      # ohne Marke, sonst übersprünge der nächste Push einen nie geprüften
      # Start.
      - name: Startcheck verdict
        id: verdict
        if: steps.decide.outputs.build == 'true'
        run: bash scripts/startcheck.sh verdict android

      # Hochgeladen wird, sobald ein Versuch scheiterte, auch wenn der zweite
      # bestand: Ein Aussetzer, der nur die Wiederholung kostet, soll sich
      # nachträglich erklären lassen. Bei rotem Urteil immer, auch ohne
      # Gerätelog (`run` vom Step-Limit vor der Diagnose beendet), damit die
      # Fehler-Annotation nie auf ein fehlendes Artefakt zeigt; findet die
      # Action keine Datei, warnt sie nur (Vorgabe `if-no-files-found: warn`).
      # `!cancelled()`, damit der Upload nach rotem Urteil überhaupt läuft.
      # `continue-on-error`, weil ein Aussetzer des Artefaktdienstes einen
      # bestandenen Lauf sonst rot färbte und die Marke kostete.
      - name: Upload startcheck diagnostics
        if: ${{ !cancelled() && (steps.verdict.outcome == 'failure' || hashFiles('startcheck-artifacts/device-*.log') != '') }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: startcheck-android
          path: startcheck-artifacts/
          retention-days: 7

      # Die Marke entsteht erst nach Compile und bestandenem Startcheck
      # (`steps.verdict.outputs.ok`) und ohne `always()` oder `!cancelled()`:
      # Das implizite `success()` lässt einen roten oder abgebrochenen Lauf
      # keine Marke hinterlassen. Anders als die großen Caches wird sie auf
      # jedem Ereignis gespeichert, auch auf PRs — die Datei ist winzig, und
      # ein PR-Eintrag lässt die weiteren Pushes desselben PRs überspringen.
      # Gab es sie schon (Vollbuild per `schedule` oder `workflow_dispatch`),
      # bleibt sie stehen; Cache-Einträge sind unveränderlich. `path` muss
      # exakt dem Lookup oben entsprechen: GitHub versioniert Cache-Einträge
      # über den Pfad, bei Abweichung träfe der Lookup nie, und es würde still
      # nie übersprungen.
      - name: Write native build marker
        if: steps.decide.outputs.build == 'true' && steps.marker.outputs.cache-hit != 'true' && steps.verdict.outputs.ok == 'true'
        env:
          NATIVE_KEY: ${{ steps.native-key.outputs.key }}
          COMMIT_SHA: ${{ github.sha }}
        run: printf '%s\n%s\n' "$NATIVE_KEY" "$COMMIT_SHA" > .native-build-marker

      - name: Save native build marker
        if: steps.decide.outputs.build == 'true' && steps.marker.outputs.cache-hit != 'true' && steps.verdict.outputs.ok == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .native-build-marker
          key: ${{ steps.native-key.outputs.key }}

  ios:
    name: iOS (prebuild · pod install · xcodebuild · Startcheck)
    runs-on: macos-latest
    timeout-minutes: 90
    # KEIN ccache hier — bewusst entfernt, nicht vergessen. Zwei Anläufe
    # (USE_CCACHE=1 als Step-env, dann CCACHE_DIR zusätzlich als
    # xcodebuild-Build-Setting) haben nachweislich NULL ccache-Aufrufe erzeugt:
    # `ccache --show-stats` meldete keine einzige "Cacheable call", und sowohl
    # /tmp/ccache als auch ~/Library/Caches/ccache blieben leer. RNs Wrapper
    # endet auf `exec $CCACHE_BINARY clang "$@"` — erreicht CCACHE_BINARY den
    # Compiler-Prozess nicht, degradiert die Zeile still zu plain clang, der
    # Build wird grün und nichts wird gecacht. Vor einem dritten Versuch erst
    # BELEGEN, dass die Variable ankommt (ADR-016, Consequences).
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Kein Git-Schritt folgt dem Checkout, der GITHUB_TOKEN wird also nie
          # gebraucht — ihn trotzdem in .git/config zu hinterlassen, exponiert ihn
          # nur gegenüber dem vielen Fremdcode, den dieser Workflow ausführt:
          # bun-Postinstall-Skripte, expo-Config-Plugins, CocoaPods- und
          # Gradle-Plugins. `permissions: contents: read` begrenzt den Schaden,
          # beseitigt ihn aber nicht. (Gilt nicht für expo-sdk-sync.yml — der
          # pusht und braucht die Credentials.)
          persist-credentials: false

      - name: Setup toolchain (mise)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          # mise selbst gepinnt, nicht nur die Tools darin. Ohne `version`
          # fragt die Action nach „latest" — und mise' Versions-Endpunkt kann
          # eine Version melden, deren GitHub-Release noch gar nicht
          # veröffentlicht ist. Genau das ist am 2026-09-08 passiert: Der
          # Endpunkt nannte 2026.9.3, das Release existierte nicht, und alle
          # drei Jobs starben nach 15 Sekunden an einem 404 beim Download —
          # vor der ersten Zeile Projektcode. Ein Pin macht diesen Workflow
          # gegen fremde Release-Rennen immun und passt zu mise.toml, das
          # node, bun und java ohnehin exakt festschreibt. Beim Anheben
          # prüfen, dass das Release wirklich existiert:
          # https://github.com/jdx/mise/releases
          version: 2026.11.5
          # Schreibt den mise-Cache nur auf main (siehe Cache-Kommentar oben).
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      # Schlüssel, Marke und Entscheidung wie im Android-Job, Begründung dort.
      # Die Versionen der fünf Pods vom CocoaPods-CDN legen die RN-Podspecs
      # fest; driften kann nur, was das CDN ausliefert, und das macOS-Image
      # abseits von Xcode (CocoaPods, Ruby). Beides deckt der Wochenbuild ab.
      - name: Native build key
        id: native-key
        run: |
          key="$(bash scripts/native-build-key.sh ios)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Look up native build marker
        id: marker
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .native-build-marker
          key: ${{ steps.native-key.outputs.key }}
          lookup-only: true

      - name: Decide whether to build
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          MARKER_HIT: ${{ steps.marker.outputs.cache-hit }}
          NATIVE_KEY: ${{ steps.native-key.outputs.key }}
        run: |
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ] || [ "$MARKER_HIT" != true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::iOS: Derselbe native Stand wurde bereits gebaut und gestartet (Schlüssel $NATIVE_KEY). Prebuild, Compile und Startcheck entfallen, ein Startabsturz durch JS-Änderungen bleibt in diesem Lauf ungeprüft."
          fi

      # `--no-install` skips BOTH the package-manager run and `pod install`;
      # pods are installed explicitly below, after the CocoaPods cache is back.
      - name: Prebuild (ios)
        if: steps.decide.outputs.build == 'true'
        run: bunx expo prebuild --platform ios --no-install --clean

      # Keyed on bun.lock + app.json rather than Podfile.lock: the lockfile is
      # generated by the prebuild step above and does not exist when the key is
      # evaluated. `ios/Pods` wird absichtlich nicht gecacht: Ein über den
      # Fallback-Schlüssel wiederhergestelltes `Pods` mit Binaries einer anderen
      # Version ist die Fehlerklasse aus ADR-007. `~/Library/Caches/CocoaPods`
      # ist nur der Download-Cache (Specs und Quellen), darum unbedenklich.
      - name: Cache CocoaPods
        id: pods-cache
        if: steps.decide.outputs.build == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('bun.lock', 'app.json') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Pod install
        if: steps.decide.outputs.build == 'true'
        working-directory: ios
        run: pod install

      # Release statt Debug: Nur Release bundelt das JS in die App, und der
      # Startcheck unten läuft ohne Metro. Simulator-Destination und
      # CODE_SIGNING_ALLOWED=NO halten den Build frei von Zugangsdaten: keine
      # Zertifikate, keine Provisioning-Profile, keine Secrets, kein
      # Expo-Konto. Heraus kommt eine App für den Simulator, keine für Geräte
      # oder den Store; das ist eine eigene Baustelle (EAS, siehe
      # docs/TODO.md).
      #
      # ARCHS=arm64: Die generische Simulator-Destination hat keine aktive
      # Architektur, Xcode baut deshalb arm64 und x86_64. Der Runner ist arm64,
      # x86_64 prüft nichts zusätzlich und kostet nur Compile-Zeit; arm64 ist
      # zugleich die Architektur der Geräte.
      #
      # No pipe into a log formatter on purpose: a pipeline without `pipefail`
      # masks the exit status, the same trap expo-sdk-sync.yml documents.
      - name: Xcodebuild (simulator, unsigned)
        if: steps.decide.outputs.build == 'true'
        run: |
          xcodebuild \
            -workspace ios/ElternFlowAI.xcworkspace \
            -scheme ElternFlowAI \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            build

      # Kein `always()`, `path` wie im Restore-Step: Begründung im `bundle`-Job.
      - name: Save CocoaPods cache (main only)
        if: steps.decide.outputs.build == 'true' && github.ref == 'refs/heads/main' && steps.pods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}

      # Startcheck, Urteil und Upload wie im Android-Job, Begründung dort,
      # ebenso die Regel fürs Joblimit: hier Setup und Compile plus 10 + 15 +
      # 20 Minuten. Den zweiten Boot erledigt hier `boot-ios` selbst, weil
      # Booten und Prüfen getrennte Steps sind.
      - name: Install Maestro
        id: maestro
        if: steps.decide.outputs.build == 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: bash scripts/startcheck.sh install-maestro

      - name: Boot iOS simulator
        id: boot
        if: steps.decide.outputs.build == 'true' && steps.maestro.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: bash scripts/startcheck.sh boot-ios

      - name: Startcheck (iOS simulator)
        id: startcheck
        if: steps.decide.outputs.build == 'true' && steps.maestro.outcome == 'success' && steps.boot.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        run: bash scripts/startcheck.sh run ios ios/build/Build/Products/Release-iphonesimulator/ElternFlowAI.app

      - name: Startcheck verdict
        id: verdict
        if: steps.decide.outputs.build == 'true'
        run: bash scripts/startcheck.sh verdict ios

      - name: Upload startcheck diagnostics
        if: ${{ !cancelled() && (steps.verdict.outcome == 'failure' || hashFiles('startcheck-artifacts/device-*.log') != '') }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: startcheck-ios
          path: startcheck-artifacts/
          retention-days: 7

      # Wie im Android-Job: nur nach Compile und bestandenem Startcheck, auf
      # jedem Ereignis, `path` exakt wie im Lookup.
      - name: Write native build marker
        if: steps.decide.outputs.build == 'true' && steps.marker.outputs.cache-hit != 'true' && steps.verdict.outputs.ok == 'true'
        env:
          NATIVE_KEY: ${{ steps.native-key.outputs.key }}
          COMMIT_SHA: ${{ github.sha }}
        run: printf '%s\n%s\n' "$NATIVE_KEY" "$COMMIT_SHA" > .native-build-marker

      - name: Save native build marker
        if: steps.decide.outputs.build == 'true' && steps.marker.outputs.cache-hit != 'true' && steps.verdict.outputs.ok == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .native-build-marker
          key: ${{ steps.native-key.outputs.key }}
