name: Native Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Nur PRs brechen einander ab. Der Event-Name in der Gruppe hält einen Push auf
# `main` aus der Gruppe des Wochenbuilds heraus, sodass er ihn nicht abbricht.
concurrency:
  group: native-build-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Caches: Nur `main` schreibt (die `actions/cache/save`-Steps am Jobende), PRs
# lesen nur. Ein PR-Cache ist für andere PRs unsichtbar und verdrängte bei
# 10 GB Repo-Limit die nützlichen von `main`. Einzige Ausnahme ist die winzige
# Marke „nativer Stand grün gebaut" der Compile-Jobs, die jedes Ereignis
# schreibt (siehe `native-key` im Android-Job).

# Same Supabase placeholders as ci.yml. Strictly only the `bundle` job needs
# them: Metro inlines EXPO_PUBLIC_* at bundle time, so leaving them unset would
# bake `undefined` into the native bundle instead of the string the app expects.
# The two compile jobs build Debug variants, which don't bundle JS at all —
# harmless there, and keeping one env block avoids two places to update.
env:
  EXPO_PUBLIC_SUPABASE_URL: https://test.supabase.invalid
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test

# Three independent jobs, deliberately WITHOUT `needs:` between them. Runner
# minutes are free on a public repo, so the only currency is wall-clock: running
# them in parallel makes the PR wait max(bundle, android, ios) instead of the
# sum. iOS dominates either way.
#
# Toolchain comes from mise.toml via mise-action (java 17 · node 24 · bun) —
# NOT from setup-bun as in ci.yml. The native builds are exactly where the pins
# in mise.toml are load-bearing (see ADR-016), so they read the same file the
# developer's shell does rather than a second copy in YAML.
jobs:
  bundle:
    name: Metro bundle (ios · android)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Kein Git-Schritt folgt dem Checkout, der GITHUB_TOKEN wird also nie
          # gebraucht — ihn trotzdem in .git/config zu hinterlassen, exponiert ihn
          # nur gegenüber dem vielen Fremdcode, den dieser Workflow ausführt:
          # bun-Postinstall-Skripte, expo-Config-Plugins, CocoaPods- und
          # Gradle-Plugins. `permissions: contents: read` begrenzt den Schaden,
          # beseitigt ihn aber nicht. (Gilt nicht für expo-sdk-sync.yml — der
          # pusht und braucht die Credentials.)
          persist-credentials: false

      - name: Setup toolchain (mise)
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          # mise selbst gepinnt, nicht nur die Tools darin. Ohne `version`
          # fragt die Action nach „latest" — und mise' Versions-Endpunkt kann
          # eine Version melden, deren GitHub-Release noch gar nicht
          # veröffentlicht ist. Genau das ist am 2026-09-08 passiert: Der
          # Endpunkt nannte 2026.9.3, das Release existierte nicht, und alle
          # drei Jobs starben nach 15 Sekunden an einem 404 beim Download —
          # vor der ersten Zeile Projektcode. Ein Pin macht diesen Workflow
          # gegen fremde Release-Rennen immun und passt zu mise.toml, das
          # node, bun und java ohnehin exakt festschreibt. Beim Anheben
          # prüfen, dass das Release wirklich existiert:
          # https://github.com/jdx/mise/releases
          version: 2026.10.20
          # Schreibt den mise-Cache nur auf main (siehe Cache-Kommentar oben).
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache Bun dependencies
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      # The native JS bundle is built NOWHERE else in CI. ci.yml's web export
      # resolves `DateTimePickerSheet.web.tsx`; the native sibling
      # `DateTimePickerSheet.tsx` (split off in ADR-010) is never compiled by it.
      # Debug APK/IPA builds don't close that gap either — they load JS from
      # Metro at runtime instead of bundling it. Two invocations because
      # `expo export -p` takes a single platform, and `all` would redo the web
      # export ci.yml already covers.
      - name: Metro bundle (iOS)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bunx expo export --platform ios --output-dir dist-ios

      - name: Metro bundle (Android)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bunx expo export --platform android --output-dir dist-android

      # Kein `always()`: Das implizite `success()` verhindert, dass ein roter
      # Lauf einen Cache schreibt. `path` muss dem Restore-Step entsprechen,
      # sonst ist der gespeicherte Eintrag für ihn unsichtbar.
      - name: Save Bun cache (main only)
        if: github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}

  android:
    name: Android (prebuild · assembleDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Kein Git-Schritt folgt dem Checkout, der GITHUB_TOKEN wird also nie
          # gebraucht — ihn trotzdem in .git/config zu hinterlassen, exponiert ihn
          # nur gegenüber dem vielen Fremdcode, den dieser Workflow ausführt:
          # bun-Postinstall-Skripte, expo-Config-Plugins, CocoaPods- und
          # Gradle-Plugins. `permissions: contents: read` begrenzt den Schaden,
          # beseitigt ihn aber nicht. (Gilt nicht für expo-sdk-sync.yml — der
          # pusht und braucht die Credentials.)
          persist-credentials: false

      - name: Setup toolchain (mise)
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          # mise selbst gepinnt, nicht nur die Tools darin. Ohne `version`
          # fragt die Action nach „latest" — und mise' Versions-Endpunkt kann
          # eine Version melden, deren GitHub-Release noch gar nicht
          # veröffentlicht ist. Genau das ist am 2026-09-08 passiert: Der
          # Endpunkt nannte 2026.9.3, das Release existierte nicht, und alle
          # drei Jobs starben nach 15 Sekunden an einem 404 beim Download —
          # vor der ersten Zeile Projektcode. Ein Pin macht diesen Workflow
          # gegen fremde Release-Rennen immun und passt zu mise.toml, das
          # node, bun und java ohnehin exakt festschreibt. Beim Anheben
          # prüfen, dass das Release wirklich existiert:
          # https://github.com/jdx/mise/releases
          version: 2026.10.20
          # Schreibt den mise-Cache nur auf main (siehe Cache-Kommentar oben).
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      # A wrong JDK fails Gradle with "Unsupported class file major version",
      # which reads like a project bug rather than a toolchain mismatch. The
      # ubuntu runner ships its own JDK and its own JAVA_HOME, so assert that
      # mise's pin actually won before spending 15 minutes finding out.
      - name: Assert JDK pin from mise.toml
        run: |
          set -e
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          java -version
          major="$(java -version 2>&1 | sed -n '1s/.*version "\([0-9]*\).*/\1/p')"
          if [ "$major" != "17" ]; then
            echo "::error::Expected JDK 17 (mise.toml pin), got major version '${major:-<unknown>}'."
            exit 1
          fi

      - name: Cache Bun dependencies
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      # Schlüssel des nativen Stands; was er enthält, steht im Kopf von
      # scripts/native-build-key.sh. Berechnet vor dem Prebuild, weil der
      # Fingerprint ein vorhandenes `android/` mithashen würde. Zuweisung
      # statt `echo "key=$(…)"`, damit `bash -e` abbricht, wenn das Skript
      # scheitert: Ein leerer Schlüssel darf nie entstehen.
      - name: Native build key
        id: native-key
        run: |
          key="$(bash scripts/native-build-key.sh android)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # Die Marke ist ein Cache-Eintrag unter diesem Schlüssel; `lookup-only`
      # prüft nur, ob es ihn gibt. Ein PR sieht seine eigenen Marken und die
      # aus `main`, ein Push auf `main` nur die aus `main`.
      - name: Look up native build marker
        id: marker
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .native-build-marker
          key: ${{ steps.native-key.outputs.key }}
          lookup-only: true

      # `schedule` und `workflow_dispatch` bauen immer: Der Wochenbuild fängt
      # Drift, die nicht im Schlüssel steht, der manuelle Lauf prüft den
      # Vollbuild-Pfad. Übersprungen wird per `if` an jedem folgenden Step,
      # nicht am Job: Eine Job-Bedingung bräuchte `needs:` auf einen eigenen
      # Schlüssel-Job. So endet der Job unter seinem Namen grün, wie es der
      # Required Check erwartet.
      - name: Decide whether to build
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          MARKER_HIT: ${{ steps.marker.outputs.cache-hit }}
          NATIVE_KEY: ${{ steps.native-key.outputs.key }}
        run: |
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ] || [ "$MARKER_HIT" != true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android: Derselbe native Stand wurde bereits grün gebaut (Schlüssel $NATIVE_KEY), Prebuild und Compile entfallen."
          fi

      # `android/` is gitignored (CNG), so it never exists in a fresh checkout.
      # `--clean` states the invariant anyway: CI always compiles a freshly
      # generated native project, never a stale one. `--no-install` skips the
      # package-manager run that `bun install` above already did.
      - name: Prebuild (android)
        if: steps.decide.outputs.build == 'true'
        run: bunx expo prebuild --platform android --no-install --clean

      # Restored AFTER prebuild: `--clean` wipes the native directory, so a
      # cache seeded before it would be thrown away.
      - name: Cache Gradle
        id: gradle-cache
        if: steps.decide.outputs.build == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('bun.lock', 'app.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Debug, not Release: Release additionally bundles and minifies JS (the
      # `bundle` job already covers that) and would need a signing keystore.
      #
      # `--build-cache` weil `prebuild --clean` jeden Lauf sämtlichen
      # inkrementellen Build-Zustand in `android/` löscht — ohne ihn cached der
      # Gradle-Cache oben NUR heruntergeladene Dependencies, also nicht den
      # teuren Teil. Der lokale Build-Cache liegt unter
      # ~/.gradle/caches/build-cache-1 und ist damit vom bestehenden
      # Cache-Step bereits abgedeckt. Erwartungsmanagement: das beschleunigt
      # Kotlin-/Java-Compile und Resource-Tasks, NICHT die CMake/NDK-Schritte —
      # `externalNativeBuild`-Tasks sind nicht cachebar.
      - name: Gradle assembleDebug
        if: steps.decide.outputs.build == 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --build-cache

      # Kein `always()`, `path` wie im Restore-Step: Begründung im `bundle`-Job.
      # Bun wird hier nur geladen; den Schlüssel schreibt der `bundle`-Job.
      - name: Save Gradle cache (main only)
        if: steps.decide.outputs.build == 'true' && github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      # Die Marke entsteht erst nach dem Compile und ohne `always()` oder
      # `!cancelled()`: Das implizite `success()` lässt einen roten oder
      # abgebrochenen Lauf keine Marke hinterlassen. Anders als die großen
      # Caches wird sie auf jedem Ereignis gespeichert, auch auf PRs — die
      # Datei ist winzig, und ein PR-Eintrag lässt die weiteren Pushes
      # desselben PRs überspringen. Gab es sie schon (Vollbuild per `schedule`
      # oder `workflow_dispatch`), bleibt sie stehen; Cache-Einträge sind
      # unveränderlich. `path` muss exakt dem Lookup oben entsprechen: GitHub
      # versioniert Cache-Einträge über den Pfad, bei Abweichung träfe der
      # Lookup nie, und es würde still nie übersprungen.
      - name: Write native build marker
        if: steps.decide.outputs.build == 'true' && steps.marker.outputs.cache-hit != 'true'
        env:
          NATIVE_KEY: ${{ steps.native-key.outputs.key }}
          COMMIT_SHA: ${{ github.sha }}
        run: printf '%s\n%s\n' "$NATIVE_KEY" "$COMMIT_SHA" > .native-build-marker

      - name: Save native build marker
        if: steps.decide.outputs.build == 'true' && steps.marker.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .native-build-marker
          key: ${{ steps.native-key.outputs.key }}

  ios:
    name: iOS (prebuild · pod install · xcodebuild)
    runs-on: macos-latest
    timeout-minutes: 90
    # KEIN ccache hier — bewusst entfernt, nicht vergessen. Zwei Anläufe
    # (USE_CCACHE=1 als Step-env, dann CCACHE_DIR zusätzlich als
    # xcodebuild-Build-Setting) haben nachweislich NULL ccache-Aufrufe erzeugt:
    # `ccache --show-stats` meldete keine einzige "Cacheable call", und sowohl
    # /tmp/ccache als auch ~/Library/Caches/ccache blieben leer. RNs Wrapper
    # endet auf `exec $CCACHE_BINARY clang "$@"` — erreicht CCACHE_BINARY den
    # Compiler-Prozess nicht, degradiert die Zeile still zu plain clang, der
    # Build wird grün und nichts wird gecacht. Vor einem dritten Versuch erst
    # BELEGEN, dass die Variable ankommt (ADR-016, Consequences).
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Kein Git-Schritt folgt dem Checkout, der GITHUB_TOKEN wird also nie
          # gebraucht — ihn trotzdem in .git/config zu hinterlassen, exponiert ihn
          # nur gegenüber dem vielen Fremdcode, den dieser Workflow ausführt:
          # bun-Postinstall-Skripte, expo-Config-Plugins, CocoaPods- und
          # Gradle-Plugins. `permissions: contents: read` begrenzt den Schaden,
          # beseitigt ihn aber nicht. (Gilt nicht für expo-sdk-sync.yml — der
          # pusht und braucht die Credentials.)
          persist-credentials: false

      - name: Setup toolchain (mise)
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          # mise selbst gepinnt, nicht nur die Tools darin. Ohne `version`
          # fragt die Action nach „latest" — und mise' Versions-Endpunkt kann
          # eine Version melden, deren GitHub-Release noch gar nicht
          # veröffentlicht ist. Genau das ist am 2026-09-08 passiert: Der
          # Endpunkt nannte 2026.9.3, das Release existierte nicht, und alle
          # drei Jobs starben nach 15 Sekunden an einem 404 beim Download —
          # vor der ersten Zeile Projektcode. Ein Pin macht diesen Workflow
          # gegen fremde Release-Rennen immun und passt zu mise.toml, das
          # node, bun und java ohnehin exakt festschreibt. Beim Anheben
          # prüfen, dass das Release wirklich existiert:
          # https://github.com/jdx/mise/releases
          version: 2026.10.20
          # Schreibt den mise-Cache nur auf main (siehe Cache-Kommentar oben).
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      # Schlüssel, Marke und Entscheidung wie im Android-Job, Begründung dort.
      # Die Versionen der fünf Pods vom CocoaPods-CDN legen die RN-Podspecs
      # fest; driften kann nur, was das CDN ausliefert, und das macOS-Image
      # abseits von Xcode (CocoaPods, Ruby). Beides deckt der Wochenbuild ab.
      - name: Native build key
        id: native-key
        run: |
          key="$(bash scripts/native-build-key.sh ios)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Look up native build marker
        id: marker
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .native-build-marker
          key: ${{ steps.native-key.outputs.key }}
          lookup-only: true

      - name: Decide whether to build
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          MARKER_HIT: ${{ steps.marker.outputs.cache-hit }}
          NATIVE_KEY: ${{ steps.native-key.outputs.key }}
        run: |
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ] || [ "$MARKER_HIT" != true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::iOS: Derselbe native Stand wurde bereits grün gebaut (Schlüssel $NATIVE_KEY), Prebuild und Compile entfallen."
          fi

      # `--no-install` skips BOTH the package-manager run and `pod install`;
      # pods are installed explicitly below, after the CocoaPods cache is back.
      - name: Prebuild (ios)
        if: steps.decide.outputs.build == 'true'
        run: bunx expo prebuild --platform ios --no-install --clean

      # Keyed on bun.lock + app.json rather than Podfile.lock: the lockfile is
      # generated by the prebuild step above and does not exist when the key is
      # evaluated. `ios/Pods` wird absichtlich nicht gecacht: Ein über den
      # Fallback-Schlüssel wiederhergestelltes `Pods` mit Binaries einer anderen
      # Version ist die Fehlerklasse aus ADR-007. `~/Library/Caches/CocoaPods`
      # ist nur der Download-Cache (Specs und Quellen), darum unbedenklich.
      - name: Cache CocoaPods
        id: pods-cache
        if: steps.decide.outputs.build == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('bun.lock', 'app.json') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Pod install
        if: steps.decide.outputs.build == 'true'
        working-directory: ios
        run: pod install

      # Simulator destination + CODE_SIGNING_ALLOWED=NO is what keeps this gate
      # credential-free: no certificates, no provisioning profiles, no secrets,
      # no Expo account. It proves the project compiles, which is the question
      # being asked — producing an installable artifact is a separate concern
      # (see docs/TODO.md on EAS).
      #
      # ARCHS=arm64: Die generische Simulator-Destination hat keine aktive
      # Architektur, Xcode baut deshalb arm64 und x86_64. Der Runner ist arm64,
      # x86_64 prüft nichts zusätzlich und kostet nur Compile-Zeit; arm64 ist
      # zugleich die Architektur der Geräte.
      #
      # No pipe into a log formatter on purpose: a pipeline without `pipefail`
      # masks the exit status, the same trap expo-sdk-sync.yml documents.
      - name: Xcodebuild (simulator, unsigned)
        if: steps.decide.outputs.build == 'true'
        run: |
          xcodebuild \
            -workspace ios/ElternFlowAI.xcworkspace \
            -scheme ElternFlowAI \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            build

      # Kein `always()`, `path` wie im Restore-Step: Begründung im `bundle`-Job.
      - name: Save CocoaPods cache (main only)
        if: steps.decide.outputs.build == 'true' && github.ref == 'refs/heads/main' && steps.pods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}

      # Wie im Android-Job: nur nach erfolgreichem Compile, auf jedem
      # Ereignis, `path` exakt wie im Lookup.
      - name: Write native build marker
        if: steps.decide.outputs.build == 'true' && steps.marker.outputs.cache-hit != 'true'
        env:
          NATIVE_KEY: ${{ steps.native-key.outputs.key }}
          COMMIT_SHA: ${{ github.sha }}
        run: printf '%s\n%s\n' "$NATIVE_KEY" "$COMMIT_SHA" > .native-build-marker

      - name: Save native build marker
        if: steps.decide.outputs.build == 'true' && steps.marker.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .native-build-marker
          key: ${{ steps.native-key.outputs.key }}
