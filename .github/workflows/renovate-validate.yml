name: Renovate Config

# Läuft nur, wenn die Renovate-Config oder dieser Workflow selbst angefasst
# wird — also fast nie. Grund für den Aufwand: eine schema-ungültige Config
# lässt Renovate auf seine Defaults zurückfallen, und Defaults heißt hier,
# dass die Expo-Regel nicht greift und react-native-Majors ins Haus stehen.
# Siehe ADR-013.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/renovate.json5"
      - ".github/workflows/renovate-validate.yml"

permissions:
  contents: read

concurrency:
  group: renovate-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: renovate-config-validator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Renovate 44 deklariert "engines": { "node": "^24.11.0" }. npm behandelt
      # eine verletzte engines-Anforderung nur als Warnung (EBADENGINE), der
      # Install schlägt also nicht fehl — Renovate scheitert stattdessen erst
      # zur Laufzeit mit einem Fehler, der wie ein Config-Problem aussieht statt
      # wie ein Node-Problem. mise.toml pinnt Node 24 lokal; dieser Schritt
      # spiegelt das für den Runner.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # Kein Devdep im Repo: das renovate-Paket ist groß und würde bei jedem
      # `bun install` mitgezogen, obwohl es nur hier gebraucht wird.
      #
      # `renovate@latest` statt bare `renovate`: ein bare Spec lässt npx jeden
      # zwischengespeicherten Cache-Treffer wiederverwenden — das hatte lokal
      # während der Umsetzung einen `renovate@37.440.7` von Juli 2024 aus dem
      # Cache gezogen und einen korrekten Config-Wert fälschlich als ungültig
      # gemeldet. `@latest` ist dabei kein Versions-Pin, sondern erzwingt nur
      # eine frische npx-Auflösung statt eine gecachte Installation
      # wiederzuverwenden. `--no-global` validiert `.github/renovate.json5`
      # explizit im richtigen Scope — es ist eine Repo-Config, keine globale
      # Renovate-Config.
      - name: Validate
        run: npx --yes --package renovate@latest -- renovate-config-validator --strict --no-global .github/renovate.json5
