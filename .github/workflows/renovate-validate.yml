name: Renovate Config

# Läuft nur, wenn die Renovate-Config oder dieser Workflow selbst angefasst
# wird — also fast nie. Grund für den Aufwand: eine schema-ungültige Config
# lässt Renovate auf seine Defaults zurückfallen, und Defaults heißt hier,
# dass die Expo-Regel nicht greift und react-native-Majors ins Haus stehen.
# Siehe ADR-013.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/renovate.json5"
      - ".github/workflows/renovate-validate.yml"

permissions:
  contents: read

concurrency:
  group: renovate-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: renovate-config-validator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Kein Devdep im Repo: das renovate-Paket ist groß und würde bei jedem
      # `bun install` mitgezogen, obwohl es nur hier gebraucht wird.
      #
      # `renovate@latest` statt bare `renovate`: ein bare Spec lässt npx jeden
      # zwischengespeicherten Cache-Treffer wiederverwenden, wodurch lokale
      # Läufe und CI unbemerkt gegen unterschiedliche Renovate-Versionen
      # validieren können (siehe Fix-Runde 1 in task-1-report.md). `--no-global`
      # validiert `.github/renovate.json5` explizit im richtigen Scope — es ist
      # eine Repo-Config, keine globale Renovate-Config.
      - name: Validate
        run: npx --yes --package renovate@latest -- renovate-config-validator --strict --no-global .github/renovate.json5
