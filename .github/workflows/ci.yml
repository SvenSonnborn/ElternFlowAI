name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Public (publishable) Supabase config. features/supabase/client.ts throws at
# module load if these are unset, and CI has no .env.local (git-ignored). The
# web export bundles that module, so it needs them. Placeholder values suffice —
# no real network call happens at build time. Same values the Bun test preload
# defaults to.
env:
  EXPO_PUBLIC_SUPABASE_URL: https://test.supabase.invalid
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test

jobs:
  ci:
    name: Build & Quality (format · lint · typecheck · test · web build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      # Cheap static checks first. Guard: `!cancelled() && install succeeded` —
      # an early *check* failure never hides a later one (all checks run, full
      # signal per run), but a failed frozen-lockfile install skips them all
      # instead of cascading errors against a dependency-less repo.
      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run format:check

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Bun's test runner (see bunfig.toml preload) — NOT `bun run test`/jest,
        # which is broken under jest-expo 55. Mirrors the local `bun test` command.
        run: bun test

      # Web smoke build last — the most expensive step. Verifies the web bundle
      # compiles. Uses the Supabase placeholder env above.
      - name: Web smoke build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bunx expo export --platform web --output-dir dist
